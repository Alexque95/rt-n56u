name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled'
        required: false
        default: 'no'

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    env:
      targets: NEWIFI3
      images_dir: /opt/images
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          # 彻底禁用 apt-mirrors 机制，重写为纯官方源，绕开 azure.archive.ubuntu.com 的 DNS 故障
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo sh -c 'cat > /etc/apt/sources.list <<EOF
          deb http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          EOF'
          sudo rm -f /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update -y || sudo apt-get update -y
          sudo apt-get install -y libtool-bin gperf python3-docutils autopoint gettext

      - name: Prepare toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'yes' }}
        with:
          limit-access-to-actor: true

      - name: Start build
        run: |
          cd trunk
          mkdir -p ${images_dir}
          for m in $targets; do fakeroot ./build_firmware_ci $m; \
          if [ $? = 0 ]; then cp -f images/*.trx ${images_dir}/$m.trx; else exit 1; fi; \
          ./clear_tree_simple >/dev/null 2>&1; done

      - name: Create archive
        if: ${{ success() }}
        run: |
          ls -lh ${images_dir}
          GIT_VERSION=`git rev-parse --short=7 HEAD 2>/dev/null` && [ -n "$GIT_VERSION" ] && \
          image_name=NEWIFI3_${GIT_VERSION} || image_name=NEWIFI3
          cd ${images_dir}; md5sum *.trx |tee md5sum.txt; 7z a -mx=9 ${image_name}.7z ./*

      - name: Upload images to Artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: NEWIFI3_firmware
          path: ${{ env.images_dir }}/*.7z
